<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            * {
                box-sizing: border-box;
            }
            html {
                min-height: 100%;
                background-color: #0d111a;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            body{
                margin: 0;
                font-family: 'Verdana', sans-serif;
                min-height: 100vh;
                min-height: 100svh;
                overflow-x: hidden;
            }
            .maincontent {
                display: flex;
                position: relative;
                width: 100%;
                min-height: 100vh;
                min-height: 100svh;
                justify-content: center;
                align-items: center;
                color: white;
                flex-direction: column;
            }
            .centralMainContent{
                display: flex;
                gap: 16px;
                width: 50vw;
                height: 75vh;
                justify-content: center;
                align-items: center;
                color: white;
                flex-direction: column;
                backdrop-filter: blur(10px) contrast(40%) drop-shadow(4px 4px 10px black);
                border-radius: 25px;
            }
            .imgContainer {
                display: flex;
                flex: 0 1 auto;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: min(22vw, calc(100% - 124px));
                min-width: 0;
                min-height: 0;
            }
            #avatarimg{
                /*border-radius: 50%;
                border: 5px solid #0d111a;*/
                width: 22vw;
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }
            .socialButton{
                display: inline-flex;
                width: 50px;
                height: 50px;
                padding: 0;
                flex: 0 0 auto;
                border-radius: 15%;
                border: none;
                background-color: #0d111a; /* Derived from the main fur color */
                align-items: center;
                justify-content: center;
                transition: background-color 0.2s linear;
                margin: 0;
            }
            .socialContainer {
                display: flex;
                flex: 0 0 auto;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                max-width: 100%;
            }
            .socialButton:hover{
                background-color: #57607a; /* Also derived from the main fur color */
                cursor: pointer;
                
            }
            #kofi{
                background-image: url("icons/kofi.avif");
                background-position: center;
                background-repeat: no-repeat;
                background-size: contain;
                background-size: 75%;
            }
            #steam{
                background-image: url("icons/steam.svg");
                background-position: center;
                background-repeat: no-repeat;
                background-size: contain;
                background-size: 75%;
            }
            #bluesky{
                background-image: url("icons/bluesky.svg");
                background-position: center;
                background-repeat: no-repeat;
                background-size: 75%;
            }
            #mastodon{
                background-image: url("icons/mastodon.svg");
                background-position: center;
                background-repeat: no-repeat;
                background-size: 65%;
            }
            #instagram{
                background-image: url("icons/instagram.svg");
                background-position: center;
                background-repeat: no-repeat;
                background-size: 75%;
            }
            #furtrack{
                background-image: url("icons/furtrack.avif");
                background-position: center;
                background-repeat: no-repeat;
                background-size: 75%;
            }
            #telegram{
                background-image: url("icons/telegram.svg");
                background-position: center;
                background-repeat: no-repeat;
                background-size: 75%;
            }
            .backgroundAuthorLink:link{
                text-decoration: none;
                color: white;
                transition: color 0.1s linear;
            }
            .backgroundAuthorLink:hover{
                text-decoration: none;
                color: rgb(197, 197, 197);
                transition: color 0.1s linear;
            }
            .backgroundAuthorLink:active{
                text-decoration: none;
                color: rgb(197, 197, 197);
                transition: color 0.1s linear;
            }
            .backgroundAuthorLink:visited{
                text-decoration: none;
                color: white;
                transition: color 0.1s linear;
            }
            .backgroundInfo{
                position: absolute;
                bottom: 10px;
                left: 10px;
                width: fit-content;
                max-width: calc(100vw - 20px);
                backdrop-filter: blur(10px) contrast(40%) drop-shadow(4px 4px 10px black);
                border-radius: 15px;
                padding: 8px 12px;
                text-align: left;
                font-size: 14px;
                line-height: 1.5;
            }
            .backgroundInfo span {
                margin-left: 5px;
            }
            .peek{
                position: fixed;
                bottom: -120px;
                right: 25px;
                transition: bottom 0.75s;
                background-image: url('assets/blep.avif');
                background-size: contain;
                width: 200px;
                height: 200px;
            }
            .boop{
                position: absolute;
                width: 30px;
                height: 30px;
                left: 30px;
                top: 100px;
                cursor: pointer;
            }
            .boop-sixseven{
                position: absolute;
                width: 30px;
                height: 30px;
                left: 70px;
                top: 77px;
                cursor: pointer;
            }
            .peek:hover{
                bottom: -10px;
            }
            .heart{
                width: 25px;
                height: 25px;
                left: -20px;
                top: 105px;
                position: absolute;
                pointer-events: none;
            }
            @keyframes floatUp {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(-115px);
                }
            }
            .heartTop {
                animation: floatUp 1s forwards;
            }
            @media only screen and (max-width: 600px) {
                .maincontent {
                    min-height: 100vh;
                    min-height: 100svh;
                    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 100px max(16px, env(safe-area-inset-left, 0px));
                }
                .centralMainContent {
                    width: min(100%, 30rem);
                    height: auto;
                    min-height: 0;
                    padding: 24px 16px;
                    gap: 16px;
                }
                .imgContainer {
                    flex: 0 0 auto;
                    height: auto;
                }
                #avatarimg {
                    display: block;
                    width: min(70vw, 20rem);
                    height: auto;
                    max-height: none;
                }
                .socialButton {
                    width: 44px;
                    height: 44px;
                }
                .socialContainer {
                    max-width: 240px;
                }
                .backgroundInfo {
                    position: fixed;
                    bottom: max(10px, env(safe-area-inset-bottom, 0px));
                    left: max(10px, env(safe-area-inset-left, 0px));
                    font-size: clamp(12px, 3.5vw, 14px);
                }
                .peek {
                    display: none;
                }
            }
        </style>
        <script>
            var xmlHttp = new XMLHttpRequest();
            xmlHttp.onreadystatechange = function() {
                if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
                    let availableBackgrounds = JSON.parse(xmlHttp.responseText);
                    let backgroundIdToUse = Math.floor(Math.random() * (Math.floor(availableBackgrounds.length) - Math.ceil(0)) + Math.ceil(0));
                    let backgroundObject = availableBackgrounds[backgroundIdToUse];
                    document.getElementById("location").innerHTML = backgroundObject["location"];
                    document.getElementById("author").href = backgroundObject["author_url"];
                    document.getElementById("author").innerHTML = backgroundObject["author"];
                    document.documentElement.style.backgroundImage = "url(\"backgrounds/" + backgroundObject["file"] + "\")";
                }
            }
            xmlHttp.open("GET", "backgrounds/backgrounds.json", true); // true for asynchronous
            xmlHttp.send(null);
        </script>

        <script>
            // Good boy *pat* *pat*
            let boopCount = 0;
            function spawnHeart(){
                let div = document.createElement("div");
                div.className = "heart";
                let heartObject = document.createElement("object");
                heartObject.data = "assets/heart.svg";
                div.append(heartObject);
                boopCount++;
                document.getElementById("heart-container").append(div);
                requestAnimationFrame(() => div.classList.add("heartTop"));
                setTimeout(() => div.remove(), 1000);

                    document.getElementById("peek").style.backgroundImage = "url('assets/sixseven.avif')";
                    document.getElementById("peek").title = "67! (by Oggy123)";

                    document.getElementById("boop").classList.add("boop-sixseven");

                    document.getElementById("boop").classList.remove("boop-sixseven");
                    document.getElementById("boop").classList.add("boop");
